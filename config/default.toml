# Default settings. Override any of these in config/local.toml (git-ignored)
# or point --config at another file. Only the keys you set are overridden.

[game]
# The agent attaches to the first on-screen window whose title or owning app
# contains one of these strings.
window_match = ["Space Station 14", "Robust.Client", "SS14"]

[layout]
# Regions are fractions of the game window's content area: [x, y, width, height].
# Defaults assume the "Separated" UI layout (Options > Graphics > UI layout),
# which puts the game viewport on the left and chat in a panel on the right.
# Run `ss14-agent snap` and adjust until the boxes line up with your screen.
viewport = [0.0, 0.0, 0.70, 1.0]
chat = [0.705, 0.40, 0.29, 0.52]
# How many tiles the game viewport shows. SS14 renders 15 tiles high and
# `viewport.width` (default 21) tiles wide. Used to compute tile size.
viewport_tiles_high = 15
viewport_tiles_wide = 21
# Set to a positive number to force the on-screen tile size in window pixels
# (Retina pixels, not points). 0 = derive from viewport height.
tile_px = 0
# Height of the window title bar in points, excluded from the regions above.
# -1 = auto (0 when the window fills the screen, otherwise 28).
titlebar_pt = -1
# Screen areas covered by UI (buttons, hotbar, status icons) as [x, y, w, h]
# fractions, like viewport. Markers and movement tracking ignore them. The chat
# panel is always ignored. Example for the Default layout's bottom hotbar:
# masks = [[0.0, 0.937, 0.71, 0.063]]
masks = []

[capture]
# "auto" tries ScreenCaptureKit first (macOS 14+), then CGWindowListCreateImage.
backend = "auto"
# Most screenshots per second. Each one is a full-resolution copy of the window,
# so higher rates cost a lot of memory bandwidth and GPU time.
max_fps = 10

[decision]
# Provider: "openrouter" or "typesafe" (see src/ss14_agent/providers.py). The
# endpoint, key variable and image layout follow the provider; set endpoint,
# api_key_env or image_mode here only to override it. Keys can be pasted into
# the control window, which saves them in the macOS Keychain.
provider = "openrouter"
model = "inception/mercury-decide:free"
# Width the screenshot is downscaled to before sending.
image_width = 1024
timeout_s = 20
# Cap on decision calls per second (free tier rate limits are not published).
max_calls_per_s = 2.0
# Below this probability the agent waits instead of acting on a choice.
min_confidence = 0.30

[orchestrator]
# A general vision LLM that looks at the screen every so often and sets the goal
# and a short step-by-step plan. The decision model then picks actions that carry
# out the current step. Set enabled = false to run on the decision model alone.
enabled = true
# Provider: openrouter, anthropic, openai, google, xai, groq, ollama, lmstudio.
provider = "openrouter"
model = "anthropic/claude-sonnet-5.5"
# Re-plan at least this often; it also re-plans when chat, failures or a finished
# step call for it.
interval_s = 20
image_width = 1024
timeout_s = 60
max_tokens = 700

[agent]
tick_hz = 15
playbook = "janitor"
# Ask for a fresh decision at least this often even if nothing happened.
heartbeat_s = 4.0
# Minimum seconds between chat messages the agent sends.
chat_cooldown_s = 15.0
# Max object markers drawn and offered as targets per decision.
max_markers = 12
# Tiles within which the character can click/use things.
reach_tiles = 1.4
# Pause the agent as soon as you press a key or click in the game.
# Press F8 to hand control back.
takeover_on_input = true
# Pause the agent if its memory use goes above this many MB, to protect the Mac.
max_memory_mb = 2500
# Save every decision's annotated frame under logs/.
save_frames = true

[perception]
# What the decision model gets:
#   "text"  - a tile map and a list of nearby things with names, plus chat and any
#             menu/examine text, read from the screen by our own code. No image.
#   "image" - the annotated screenshot (numbered yellow boxes).
# Switchable live from the control window.
mode = "text"
# Whether the orchestrator also gets the screenshot (it always gets the text).
orchestrator_image = true
# Tile pictures learned from right-click menus are saved under data/tiles/<library>.
# Use a different name per server if their sprites differ.
library = "default"
# How closely a tile must match a learned picture to reuse its name (0-1).
match_threshold = 0.95
# When idle, right-click unknown things within probe_radius tiles to learn what they are,
# at most once every probe_interval_s seconds.
auto_probe = true
probe_radius = 6
probe_interval_s = 2.5

[ocr]
# Seconds between OCR passes on the chat panel.
chat_interval_s = 1.0
